name: ✨ Feature request
description: Suggest a new feature or an improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
assignees:
  - regg00
body:
  - type: markdown
    attributes:
      value: Describe the need first. A clear problem helps us find the best solution.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do, and what gets in the way today?
      placeholder: "As a coach, I can't ... so I have to ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true
  - type: input
    id: users
    attributes:
      label: Who benefits?
      placeholder: "e.g. athletes, coaches, admins, internal team"
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Critical – blocks work or revenue
        - Important – significant improvement
        - Nice to have
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Anything you've tried or considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, screenshots, links or examples.
